<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Vet</title>
    <link rel="stylesheet" href="css/loginstyle.css">
</head>
    
<body>
    
    <form name="formulario-login" id = "login">
        

        <div class ="form-login">
            <h1>Inicio Sesion</h1>
            <p>Ingrese sus datos:</p>
        <div class = "email-box">
        <input type="text" required id="email" placeholder="Email">
        </div>
        <div class = "password-box">
            <input type="password" required id="password" placeholder="Password">
        </div>
        <button class = "entrar-btn" type="submit">Entrar</button>
        <button type="button" class="registrar-btn" onclick="location.href='registro.html'">Registrarse</button>
        <button type="button" class="volver-btn" onclick="location.href='index.html'">Volver</button>
        </div>
        
    </form>
</body>
<script src="js/validacionloginadmin.js"></script>
</html>
